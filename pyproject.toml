[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lizzy"
version = "0.1.0"
description = "Structure-aware unitary synthesis with DLA-specialized exact routes"
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "networkx>=3.0",
    "paulie>=0.2.3",
    "kak_tools",
]

[project.optional-dependencies]
hamlib = ["h5py>=3.8", "openfermion>=1.5"]
chemistry = [
    "h5py>=3.8",
    "openfermion>=1.5",
    "ffsim>=0.0.83,<0.1",
    "qiskit>=2.0",
]
compare = ["qiskit>=1.3", "pytket>=1.30"]
test = ["pytest>=7.0"]

[tool.setuptools.packages.find]
include = ["lizzy*"]

[tool.pytest.ini_options]
markers = ["slow: tests that run a full decomposition sweep"]
