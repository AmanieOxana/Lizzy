name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONHASHSEED: "0"
  OPENBLAS_NUM_THREADS: "1"
  OMP_NUM_THREADS: "1"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  base:
    name: Base / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install base package and test runner
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[test]'
          python -m pip check
      - name: Run tests with base dependencies
        run: python -m pytest -q

  integrations-and-docs:
    name: Integrations and docs / Python 3.13
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install optional integrations and documentation tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[test,docs,ft,hamlib,gaussian,chemistry,compare,flags,bqskit]'
          python -m pip check
      - name: Verify optional dependencies import
        run: |
          python - <<'PY'
          from importlib import import_module

          for name in (
              "pygridsynth", "h5py", "openfermion", "ffsim", "qiskit", "pytket",
              "flagsynth", "pennylane", "bqskit", "bqskitrs", "sphinx", "myst_parser",
          ):
              import_module(name)
          PY
      - name: Run tests with optional integrations
        run: python -m pytest -q
      - name: Build documentation with warnings as errors
        run: python -m sphinx -W --keep-going -b html docs docs/_build/html
